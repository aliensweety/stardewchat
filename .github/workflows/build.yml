name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install flask pywin32 qrcode[pil] pystray pyinstaller pillow
      
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "StardewChat" --icon "assets/logo/app_icon.ico" --add-data "templates;templates" --add-data "assets;assets" gui.py
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StardewChat-Windows
          path: dist/StardewChat.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install flask qrcode[pil] pyinstaller pillow
      
      - name: Build macOS App
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "StardewChat" --add-data "templates:templates" --add-data "assets:assets" gui_mac.py
      
      - name: Make executable
        run: chmod +x dist/StardewChat
      
      - name: Create zip for macOS
        run: |
          cd dist
          zip -r StardewChat-macOS.zip StardewChat
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: StardewChat-macOS
          path: dist/StardewChat-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: StardewChat-Windows
          path: ./windows
      
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: StardewChat-macOS
          path: ./macos
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows/StardewChat.exe
            macos/StardewChat-macOS.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
