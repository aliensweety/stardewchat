<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StardewChat</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/logo_128.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding: 20px 16px;
            color: #1d1d1f;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        /* 头部Logo区域 */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            padding-top: 8px;
        }

        .logo-img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 600;
            color: #1d1d1f;
            letter-spacing: -0.3px;
        }

        /* 输入卡片 */
        .input-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        textarea {
            width: 100%;
            height: 100px;
            background: transparent;
            border: none;
            font-size: 16px;
            color: #1d1d1f;
            resize: none;
            outline: none;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #86868b;
        }

        .btn-send {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #8B5CF6 0%, #a855f7 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(139, 92, 246, 0.35);
            transition: all 0.2s ease;
        }

        .btn-send:active {
            transform: scale(0.98);
            opacity: 0.95;
        }

        .btn-send:disabled {
            opacity: 0.5;
        }

        /* 历史记录区域 */
        .history-section {
            margin-top: 8px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 500;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .clear-btn {
            font-size: 13px;
            color: #86868b;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.15s;
        }

        .clear-btn:active {
            background: rgba(0, 0, 0, 0.05);
            color: #ef4444;
        }

        .history-list {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .history-item {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-text {
            flex: 1;
            color: #3d3d3d;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 12px;
        }

        .history-btn {
            padding: 8px 14px;
            background: rgba(139, 92, 246, 0.1);
            color: #8B5CF6;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .history-btn:active {
            background: rgba(139, 92, 246, 0.2);
        }

        .history-empty {
            padding: 32px;
            text-align: center;
            color: #86868b;
            font-size: 14px;
        }

        /* Toast提示 */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(29, 29, 31, 0.9);
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            opacity: 0;
            transition: all 0.25s ease;
            z-index: 200;
            font-weight: 500;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 密码验证页面 */
        .auth-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
            z-index: 50;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }

        .auth-page.show {
            display: flex;
        }

        .auth-box {
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        .auth-logo {
            width: 72px;
            height: 72px;
            margin-bottom: 16px;
        }

        .auth-box h2 {
            font-size: 22px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 8px;
        }

        .auth-box p {
            color: #86868b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .auth-box input {
            width: 100%;
            padding: 16px;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            color: #1d1d1f;
            font-size: 16px;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.15s;
        }

        .auth-box input:focus {
            border-color: #8B5CF6;
        }
    </style>
</head>

<body>
    <!-- 密码验证页面 -->
    <div class="auth-page" id="authPage">
        <div class="auth-box">
            <img id="authLogo" alt="Logo" class="auth-logo">
            <h2>请输入密码</h2>
            <p>需要验证才能访问</p>
            <input type="password" id="authPassword" placeholder="输入访问密码">
            <button class="btn-send" onclick="verifyPassword()">验证</button>
        </div>
    </div>

    <!-- 主页面 -->
    <div class="container" id="mainPage">
        <div class="header">
            <img id="mainLogo" alt="Logo" class="logo-img">
            <span class="logo-text">StardewChat</span>
        </div>

        <div class="input-card">
            <textarea id="input" placeholder="输入要发送的对话..." autofocus></textarea>
            <button class="btn-send" id="sendBtn" onclick="send()">发送到星露谷</button>
        </div>

        <div class="history-section">
            <div class="history-header">
                <div class="section-title">发送历史</div>
                <button class="clear-btn" onclick="clearHistory()">清空</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">暂无记录</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const historyList = document.getElementById('historyList');
        const toast = document.getElementById('toast');
        const authPage = document.getElementById('authPage');

        let history = JSON.parse(localStorage.getItem('stardew_history') || '[]');

        // 加载logo
        async function loadLogo() {
            try {
                const res = await fetch('/api/logo');
                const data = await res.json();
                if (data.logo) {
                    const mainLogo = document.getElementById('mainLogo');
                    const authLogo = document.getElementById('authLogo');
                    if (mainLogo) mainLogo.src = data.logo;
                    if (authLogo) authLogo.src = data.logo;
                }
            } catch (e) {
                console.log('Logo load failed:', e);
            }
        }
        loadLogo();

        // 检查是否需要密码验证
        async function checkAuth() {
            const saved = localStorage.getItem('stardew_auth');
            const savedTime = localStorage.getItem('stardew_auth_time');

            // 检查是否在30天内验证过
            if (saved && savedTime) {
                const elapsed = Date.now() - parseInt(savedTime);
                if (elapsed < 30 * 24 * 60 * 60 * 1000) {
                    const res = await fetch('/api/password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'verify', password: saved })
                    });
                    const data = await res.json();
                    if (data.success) { showMain(); return; }
                }
            }

            // 检查是否设置了密码
            const res = await fetch('/api/password');
            const data = await res.json();
            if (data.has_password) {
                authPage.classList.add('show');
            } else {
                showMain();
            }
        }

        function showMain() {
            authPage.classList.remove('show');
            updateHistory();
        }

        async function verifyPassword() {
            const pwd = document.getElementById('authPassword').value;
            const res = await fetch('/api/password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'verify', password: pwd })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('stardew_auth', pwd);
                localStorage.setItem('stardew_auth_time', Date.now().toString());
                showMain();
            } else {
                showToast('密码错误');
            }
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        }

        async function send() {
            const text = input.value.trim();
            if (!text) { showToast('请输入文字'); return; }

            sendBtn.disabled = true;
            try {
                const res = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if (data.success) {
                    input.value = '';
                    addToHistory(text);
                    showToast('已发送 ✓');
                } else {
                    showToast(data.message || '发送失败');
                }
            } catch (e) {
                showToast('网络错误');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function addToHistory(text) {
            if (history[0] !== text) {
                history.unshift(text);
                if (history.length > 20) history.pop();
                localStorage.setItem('stardew_history', JSON.stringify(history));
                updateHistory();
            }
        }

        function updateHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">暂无记录</div>';
            } else {
                historyList.innerHTML = history.map((t, i) => `
                    <div class="history-item">
                        <div class="history-text">${escapeHtml(t)}</div>
                        <button class="history-btn" onclick="restore(${i})">恢复</button>
                    </div>
                `).join('');
            }
        }

        function restore(i) {
            input.value = history[i];
            input.focus();
            showToast('已恢复');
        }

        function clearHistory() {
            if (history.length === 0) return;
            history = [];
            localStorage.removeItem('stardew_history');
            updateHistory();
            showToast('已清空');
        }

        function escapeHtml(t) {
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        // 回车发送
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        checkAuth();
    </script>
</body>

</html>
